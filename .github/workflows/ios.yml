name: iOS build
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator (без подписи)
        run: |
          set -o pipefail
          xcodebuild -project ios/SnapDance.xcodeproj -scheme SnapDance -sdk iphonesimulator -configuration Debug -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Run in simulator and take screenshots
        run: |
          APP=$(find ios/build -name "SnapDance.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl list devices available | grep -E "iPhone" | head -30
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 16e \(|iPhone 15 \(|iPhone 14 \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          mkdir -p shots
          for LANG in ru es en; do
            xcrun simctl terminate "$DEV" us.snapdance.app || true
            xcrun simctl launch "$DEV" us.snapdance.app -AppleLanguages "($LANG)"
            sleep 12
            xcrun simctl io "$DEV" screenshot shots/$LANG.png
          done
          echo "---- log"; xcrun simctl spawn "$DEV" log show --last 3m --style compact --predicate 'process == "SnapDance"' 2>/dev/null | grep -iE "Fatal error|Unable to simultaneously|constraint" | tail -20 || true
      - name: Save screenshots to branch ci-screens
        run: |
          cd shots
          git init -q -b ci-screens
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "screens ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screens
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
