name: iOS release (App Store)
on:
  push:
    branches: [main]
    paths: ["ios/release/run.json"]
  workflow_dispatch:
    inputs:
      action:
        description: "setup | build | screenshots | prepare (без отправки) | submit | all"
        required: true
        default: all
      send:
        description: "Отправить на проверку App Review (true/false)"
        required: true
        default: "false"
concurrency: ios-release
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # не секреты: без файла ключа .p8 они бесполезны
      ASC_ISSUER_ID: 5a60d341-3b3d-4348-a67e-8191041ed77c
      ASC_KEY_ID: CU6G6Z29KV
      APPLE_TEAM_ID: F29T8NHFA6
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      IOS_BUNDLE_ID: us.snapdance.app
      APPLE_REVIEW_CODE: ${{ secrets.APPLE_REVIEW_CODE }}
      REVIEW_CONTACT: ${{ secrets.REVIEW_CONTACT }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: What to do
        id: what
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then A="${{ inputs.action }}"; S="${{ inputs.send }}"
          else A=$(python3 -c "import json;print(json.load(open('ios/release/run.json'))['action'])"); S=$(python3 -c "import json;print(str(json.load(open('ios/release/run.json')).get('send',False)).lower())"); fi
          echo "action=$A" >> $GITHUB_OUTPUT; echo "send=$S" >> $GITHUB_OUTPUT; echo "action=$A send=$S"
      - name: Check secrets
        run: |
          for v in ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Нет секрета $v: GitHub → Settings → Secrets and variables → Actions → New repository secret, имя ASC_KEY_P8, значение — содержимое AuthKey_CU6G6Z29KV.p8"; exit 1; fi
          done
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Python
        run: python3 -m pip install --quiet --break-system-packages pyjwt cryptography requests || python3 -m pip install --quiet pyjwt cryptography requests
      - name: App Store Connect setup (Bundle ID, категории, рейтинг, цена, покупки)
        if: steps.what.outputs.action == 'setup' || steps.what.outputs.action == 'all' || steps.what.outputs.action == 'prepare'
        run: python3 ios/release/asc.py setup

      - name: Archive & upload to App Store Connect
        if: steps.what.outputs.action == 'build' || steps.what.outputs.action == 'all' || steps.what.outputs.action == 'prepare'
        run: |
          set -o pipefail
          python3 ios/release/asc.py certs || true
          mkdir -p build && printf '%s\n' "$ASC_KEY_P8" > build/AuthKey.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $PWD/build/AuthKey.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/SnapDance.xcodeproj -scheme SnapDance -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/SnapDance.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            $AUTH 2>&1 | tee build/archive.log | grep -E "error:|warning: .*(sign|provision)|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" build/archive.log
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/SnapDance.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            $AUTH 2>&1 | tee build/export.log | grep -E "error:|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" build/export.log
          echo "Загружена сборка $BUILD_NUMBER"

      - name: Screenshots in simulator
        if: steps.what.outputs.action == 'screenshots' || steps.what.outputs.action == 'all' || steps.what.outputs.action == 'prepare'
        run: |
          set -o pipefail
          xcodebuild -project ios/SnapDance.xcodeproj -scheme SnapDance -configuration Debug -sdk iphonesimulator -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          APP=build/dd/Build/Products/Debug-iphonesimulator/SnapDance.app
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9] Plus \(|iPhone 1[5-9] Pro Max \(|iPhone 17 Air \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEV"
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$DEV" "$APP"
          shot() { # shot <locale> <lang> <n> <wait> [args…]
            local LOC=$1 LANG=$2 N=$3 W=$4; shift 4
            mkdir -p shots/$LOC
            xcrun simctl terminate "$DEV" us.snapdance.app || true
            xcrun simctl launch "$DEV" us.snapdance.app -AppleLanguages "($LANG)" "$@"
            sleep $W
            xcrun simctl io "$DEV" screenshot shots/$LOC/$N.png
          }
          for L in en-US:en es-ES:es ru:ru uk:uk; do
            LOC=${L%%:*}; LANG=${L##*:}
            shot $LOC $LANG 1 14
            shot $LOC $LANG 2 16 -sdExamples
            shot $LOC $LANG 3 12 -sdSteps -sdGlasses
            shot $LOC $LANG 4 12 -sdWallet
          done
          cp shots/en-US/4.png shots/iap-review.png
          ( rm -rf /tmp/st && mkdir -p /tmp/st/store && cp -r shots/* /tmp/st/store/ && cd /tmp/st && git init -q -b store-screens && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "store screenshots" \
            && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" store-screens ) || true
          sips -g pixelWidth -g pixelHeight shots/en-US/1.png
          python3 ios/release/asc.py screenshots shots

      - name: Submit for App Review
        if: steps.what.outputs.action == 'submit' || steps.what.outputs.action == 'all'
        run: |
          B=""; [ "${{ steps.what.outputs.action }}" = "all" ] && B="$BUILD_NUMBER"
          python3 ios/release/asc.py submit --build "$B" $([ "${{ steps.what.outputs.send }}" = "true" ] && echo --send)
      - name: Status
        if: always()
        run: python3 ios/release/asc.py status || true
